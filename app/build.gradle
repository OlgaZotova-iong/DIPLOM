plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs.kotlin'
}

android {
    namespace 'ru.edu.qamid'
    compileSdk = 36

    defaultConfig {
        applicationId "ru.edu.qamid"
        minSdk 26
        targetSdk = 36
        versionCode 14
        versionName "1.0.0"

        testInstrumentationRunner "ru.edu.qamid.runner.AllureTestRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BASE_URL", '"https://students.netoservices.ru/qamid-diplom-backend/"'
        }
        debug {
            buildConfigField "String", "BASE_URL", '"https://students.netoservices.ru/qamid-diplom-backend/"'
        }
    }
}

dependencies {
    def retrofit_version = "3.0.0"
    def okhttp_logging_version = "4.12.0"
    def fragment_version = "1.8.9"
    def lifecycle_version = "2.11.0"
    def room_version = "2.8.4"
    def nav_version = "2.9.8"
    def recycler_version = "1.4.0"
    def material_version = "1.14.0"
    def constraint_version = "2.2.1"
    def coroutines_version = "1.10.2"
    def hilt_version = "2.57.2"
    def gson_version = "2.13.1"
    def swipe_refresh_version = "1.2.0"

    implementation "androidx.core:core-ktx:1.18.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$swipe_refresh_version"
    implementation "com.google.android.material:material:$material_version"
    implementation "androidx.constraintlayout:constraintlayout:$constraint_version"

    // Room
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    // Retrofit & OkHttp
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.google.code.gson:gson:$gson_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_logging_version"

    // Корутины
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:$coroutines_version"

    // Jetpack
    implementation "androidx.fragment:fragment-ktx:$fragment_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // RecyclerView
    implementation "androidx.recyclerview:recyclerview:$recycler_version"

    // Desugar JDK Libs
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    // Hilt
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-compiler:$hilt_version"

    // Тесты
    // JUnit для unit-тестов
    testImplementation "junit:junit:4.13.2"

    // Android Test
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"

    // Espresso
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-intents:3.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:3.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-idling-resource:3.7.0"

    // Hamcrest
    androidTestImplementation "org.hamcrest:hamcrest-core:1.3"
    androidTestImplementation "org.hamcrest:hamcrest-library:1.3"

    // UiAutomator
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.4.0"

    // Hilt Testing
    androidTestImplementation("com.google.dagger:hilt-android-testing:$hilt_version")
    kaptAndroidTest("com.google.dagger:hilt-compiler:$hilt_version")

    // ✅ Allure для Android (единственно верные зависимости)
    androidTestImplementation "io.qameta.allure:allure-kotlin-android:2.4.0"
    androidTestImplementation "io.qameta.allure:allure-kotlin-junit4:2.4.0"
}

task downloadAllureResults(type: Exec) {
    group = 'verification'
    description = 'Скачивает результаты Allure с устройства в папку allure-results'
    def appId = "ru.edu.qamid"
    commandLine 'adb', 'pull', "/data/data/${appId}/files/allure-results", 'allure-results'
}
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}












